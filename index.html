<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>测测你的功德分：下辈子会投胎成什么东西</title>
  <style>
    :root {
      --ink: #1d1d22;
      --muted: #6d6d75;
      --line: #dfdce8;
      --paper: #fffdf8;
      --warm: #fff5df;
      --red: #ff4d58;
      --blue: #5277ff;
      --green: #54c35d;
      --gold: #ffc735;
      --lilac: #9a78ff;
      --shadow: 0 0 0 3px #111;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Arial Black", "Microsoft YaHei", "PingFang SC", Arial, Helvetica, sans-serif;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 1px, transparent 1px 9px),
        #070707;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      mix-blend-mode: multiply;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.28) 0 1px, transparent 1.6px),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,.20) 0 1px, transparent 1.7px);
      background-size: 23px 21px, 31px 27px;
      z-index: -1;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) 374px;
      gap: 14px;
      align-items: stretch;
      margin-bottom: 24px;
    }

    .hero-copy {
      padding: 28px;
      background: #fff;
      border: 4px solid #111;
    }

    .eyebrow {
      display: inline-flex;
      margin: 0 0 14px;
      padding: 6px 12px;
      border: 2px solid var(--ink);
      border-radius: 0;
      color: #fff;
      background: #111;
      box-shadow: none;
      transform: none;
      font-size: 14px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(42px, 6.8vw, 78px);
      line-height: .94;
      letter-spacing: 0;
      text-shadow: none;
    }

    .subtitle {
      max-width: 720px;
      margin: 18px 0 0;
      color: #111;
      font-size: 18px;
      line-height: 1.75;
    }

    .actions, .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
    }

    .result-actions {
      align-items: center;
    }

    .primary, .ghost {
      min-height: 48px;
      padding: 0 22px;
      border-radius: 0;
      border: 4px solid var(--ink);
      cursor: pointer;
      font-weight: 900;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .primary {
      color: #fff;
      background: var(--ink);
      box-shadow: none;
    }

    .ghost {
      background: #fff;
      box-shadow: none;
    }

    .primary:hover, .ghost:hover {
      transform: translateY(-2px);
      box-shadow: inset 0 -8px 0 #e8e8e8;
    }

    .alignment-board, .panel {
      border: 4px solid #111;
      border-radius: 0;
      background:
        linear-gradient(90deg, rgba(17,17,17,.04) 0 1px, transparent 1px 25%),
        #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .alignment-board {
      min-height: 368px;
      padding: 22px;
      transform: none;
    }

    .board-title {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 1000;
      text-align: center;
    }

    .axis {
      position: relative;
      height: 254px;
      border: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(239,85,85,.07), rgba(255,255,255,.76), rgba(79,116,255,.08));
    }

    .axis::before, .axis::after {
      content: "";
      position: absolute;
      background: rgba(29, 29, 34, .7);
    }

    .axis::before {
      left: 50%;
      top: 20px;
      bottom: 20px;
      width: 2px;
    }

    .axis::after {
      top: 50%;
      left: 20px;
      right: 20px;
      height: 2px;
    }

    .circle {
      position: absolute;
      top: 50%;
      width: 144px;
      height: 144px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      transform: translateY(-50%);
      opacity: .82;
    }

    .circle.bad {
      left: 52px;
      background: rgba(239, 85, 85, .18);
    }

    .circle.good {
      right: 52px;
      background: rgba(79, 116, 255, .16);
    }

    .mark {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 8px 20px rgba(239, 179, 51, .34);
      left: calc(50% - 17px);
      top: calc(50% - 17px);
      transition: left .42s ease, top .42s ease, background .42s ease;
      z-index: 2;
    }

    .label {
      position: absolute;
      z-index: 1;
      font-size: 13px;
      font-weight: 900;
      color: var(--muted);
    }

    .label.good,
    .label.bad,
    .label.order,
    .label.chaos {
      min-width: 32px;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255, 253, 248, .86);
      text-align: center;
    }

    .label.good { right: 16px; top: calc(50% - 38px); }
    .label.bad { left: 16px; top: calc(50% - 38px); }
    .label.order { left: 50%; bottom: 14px; transform: translateX(-50%); }
    .label.chaos { left: 50%; top: 14px; transform: translateX(-50%); }

    .quiz-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px;
      border-bottom: 4px solid #111;
      background: #fff;
    }

    .progress-wrap {
      flex: 1;
      height: 10px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: #fff;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #df2727 0 33%, #f4c21f 33% 66%, #157c3a 66%);
      transition: width .25s ease;
    }

    .counter {
      min-width: 78px;
      color: var(--muted);
      font-weight: 900;
      text-align: right;
    }

    .question-area {
      padding: 28px;
      min-height: 520px;
    }

    .question-tag {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 12px;
      margin-bottom: 14px;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: #111;
      color: #1d1d22;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      box-shadow: none;
      transform: none;
    }

    h2 {
      margin: 0 0 22px;
      font-size: clamp(24px, 3.8vw, 38px);
      line-height: 1.28;
      letter-spacing: 0;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      width: 100%;
      min-height: 72px;
      padding: 16px 18px;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: #fff;
      text-align: left;
      cursor: pointer;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      align-items: center;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
      box-shadow: none;
    }

    .option:hover {
      transform: translateY(-1px);
      border-color: var(--ink);
      background: #fff2bf;
    }

    .question-nav {
      display: flex;
      justify-content: flex-start;
      margin-top: 16px;
    }

    .back-btn {
      min-height: 44px;
      padding: 0 18px;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: #fff7df;
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
      box-shadow: none;
    }

    .back-btn:hover:not(:disabled) {
      background: #fff2bf;
      transform: translateY(-1px);
    }

    .back-btn:disabled {
      opacity: .38;
      cursor: not-allowed;
    }

    .letter {
      width: 34px;
      height: 34px;
      border: 1px solid var(--ink);
      border-radius: 0;
      display: grid;
      place-items: center;
      font-weight: 1000;
      background: var(--warm);
    }

    .option-text {
      font-size: 17px;
      line-height: 1.5;
      font-weight: 800;
    }

    .result {
      display: none;
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    .result.show { display: block; }
    .question-area.hide,
    .question-nav.hide { display: none; }

    .result::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .result > * {
      position: relative;
      z-index: 1;
    }

    .result.theme-heaven::before {
      opacity: 1;
      background:
        linear-gradient(90deg, rgba(17,17,17,.05) 0 1px, transparent 1px 25%),
        linear-gradient(135deg, rgba(242,179,33,.28), rgba(169,214,255,.24)),
        #f7fbff;
    }

    .result.theme-human::before {
      opacity: 1;
      background:
        linear-gradient(90deg, rgba(17,17,17,.05) 0 1px, transparent 1px 25%),
        linear-gradient(135deg, rgba(255,255,255,.86), rgba(121,180,93,.18)),
        #ffffff;
    }

    .result.theme-hell::before {
      opacity: 1;
      background:
        linear-gradient(90deg, rgba(17,17,17,.08) 0 1px, transparent 1px 25%),
        linear-gradient(135deg, rgba(213,31,42,.22), rgba(9,9,11,.16)),
        #fff4f2;
    }

    .theme-heaven .score-card {
      background: #f7fbff;
      border-color: #0a1d42;
      box-shadow: inset 0 -14px 0 rgba(242, 179, 33, .22);
    }

    .theme-human .score-card {
      background: #fff;
      border-color: #0b3f23;
      box-shadow: inset 0 -14px 0 rgba(121, 180, 93, .18);
    }

    .theme-hell .score-card {
      background: #fff4f2;
      border-color: #09090b;
      box-shadow: inset 0 -14px 0 rgba(213, 31, 42, .20);
    }

    .result-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 26px;
      align-items: start;
    }

    .score-card {
      border: 4px solid var(--ink);
      border-radius: 0;
      background: #fffaf0;
      padding: 20px;
      text-align: center;
      transform: none;
    }

    .score {
      margin: 8px 0 4px;
      font-size: 76px;
      line-height: 1;
      font-weight: 1000;
      text-shadow: none;
    }

    .score-label {
      margin: 0;
      color: var(--muted);
      font-weight: 900;
    }

    .reincarnation {
      margin: 0 0 12px;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .result-illustration {
      width: 112px;
      height: 112px;
      margin: 0 0 18px;
      border: 4px solid var(--ink);
      border-radius: 0;
      background: #fff;
      box-shadow: none;
      transform: none;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 10px;
      border: 2px solid var(--ink);
      border-radius: 0;
      background: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .result-copy {
      margin: 0;
      color: #33333a;
      font-size: 18px;
      line-height: 1.85;
    }

    .breakdown {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 22px;
    }

    .metric {
      min-height: 76px;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: #fffdf8;
      padding: 12px;
      box-shadow: none;
    }

    .metric strong {
      display: block;
      margin-bottom: 3px;
      font-size: 22px;
    }

    .metric span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .share-preview {
      display: none;
      width: min(100%, 420px);
      max-height: 76vh;
      margin-top: 22px;
      border: 4px solid var(--ink);
      border-radius: 0;
      background: #fffdf8;
      object-fit: contain;
      box-shadow: none;
    }

    .share-preview.show { display: block; }

    .qr-image {
      display: none;
    }

    .footer-note {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 860px) {
      .shell { width: min(100% - 22px, 720px); padding-top: 20px; }
      .hero { grid-template-columns: 1fr; gap: 14px; }
      .hero-copy { padding-top: 16px; }
      .alignment-board { min-height: 310px; }
      .axis { height: 220px; }
      .circle { width: 122px; height: 122px; }
      .circle.bad { left: 30px; }
      .circle.good { right: 30px; }
      .question-area { padding: 22px 16px; }
      .quiz-head { padding: 14px; }
      .result { padding: 20px 16px; }
      .result-grid { grid-template-columns: 1fr; }
      .breakdown { grid-template-columns: 1fr; }
      .score-card { max-width: 320px; }
      .share-preview { width: min(100%, 360px); max-height: none; }
      .result-actions .primary,
      .result-actions .ghost { flex: 1 1 180px; }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 18px, 420px);
        padding: 14px 0 28px;
      }
      h1 {
        font-size: 36px;
        line-height: 1.02;
      }
      h2 {
        font-size: 25px;
      }
      .subtitle {
        font-size: 15px;
        line-height: 1.65;
      }
      .primary, .ghost {
        width: 100%;
        min-height: 46px;
        padding: 0 16px;
      }
      .question-area {
        min-height: auto;
      }
      .option {
        min-height: 66px;
        padding: 13px 12px;
        grid-template-columns: 32px 1fr;
      }
      .letter {
        width: 32px;
        height: 32px;
      }
      .option-text {
        font-size: 15px;
        overflow-wrap: anywhere;
      }
      .reincarnation {
        font-size: 34px;
        line-height: 1.12;
        overflow-wrap: anywhere;
      }
      .result-copy {
        font-size: 16px;
        line-height: 1.75;
      }
      .score {
        font-size: 68px;
      }
      .result-illustration {
        width: 96px;
        height: 96px;
      }
      .share-preview {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow">功德分人格测试 · 九宫格道德阵营</p>
        <h1 id="page-title">测测你的功德分，看看下辈子会投胎成什么东西</h1>
        <p class="subtitle"><span id="questionCountText">24</span> 道灵魂小题，检测你的善恶倾向、守序程度和混乱浓度。结果会生成一张可复制的投胎报告图，适合发给朋友互相审判。</p>
        <div class="actions">
          <button class="primary" id="startBtn" type="button">开始测试</button>
          <button class="ghost" id="randomBtn" type="button">随机投胎一次</button>
        </div>
      </div>

      <aside class="alignment-board" aria-label="道德阵营坐标">
        <p class="board-title">你的灵魂坐标</p>
        <div class="axis">
          <span class="label bad">恶</span>
          <span class="label good">善</span>
          <span class="label chaos">混乱</span>
          <span class="label order">守序</span>
          <span class="circle bad"></span>
          <span class="circle good"></span>
          <span class="mark" id="soulMark"></span>
        </div>
        <p class="footer-note">答题过程中，金色小点会跟着你的选择移动。</p>
      </aside>
    </section>

    <section class="panel" id="quizPanel" aria-live="polite">
      <div class="quiz-head">
        <div class="progress-wrap" aria-label="答题进度">
          <div class="progress" id="progress"></div>
        </div>
        <div class="counter" id="counter">0 / 24</div>
      </div>

      <div class="question-area" id="questionArea">
        <span class="question-tag" id="questionTag">灵魂预热</span>
        <h2 id="questionTitle">准备好接受功德审判了吗？</h2>
        <div class="options" id="options">
          <button class="option" type="button" id="readyBtn">
            <span class="letter">Go</span>
            <span class="option-text">我准备好了，来测我的下辈子</span>
          </button>
        </div>
        <div class="question-nav hide" id="questionNav">
          <button class="back-btn" type="button" id="prevBtn">上一题</button>
        </div>
      </div>

      <div class="result" id="result">
        <div class="result-grid">
          <div class="score-card">
            <p class="score-label">你的功德分</p>
            <div class="score" id="score">50</div>
            <p class="score-label" id="scoreLevel">人间摇摆型</p>
          </div>
          <div>
            <canvas class="result-illustration" id="resultIllustration" width="224" height="224" aria-hidden="true"></canvas>
            <h2 class="reincarnation" id="rebirthName">咖啡店猫</h2>
            <div class="badge-row">
              <span class="badge" id="alignmentBadge">中立善良</span>
              <span class="badge" id="fateBadge">福报稳定型</span>
              <span class="badge" id="axisBadge">善恶轴 +0</span>
            </div>
            <p class="result-copy" id="resultCopy"></p>
            <div class="breakdown">
              <div class="metric"><strong id="goodMetric">0</strong><span>善恶轴：正数偏善，负数偏恶</span></div>
              <div class="metric"><strong id="orderMetric">0</strong><span>秩序轴：正数守序，负数混乱</span></div>
              <div class="metric"><strong id="chaosMetric">0</strong><span>混乱浓度：越高越像随机事件</span></div>
            </div>
            <canvas class="share-preview" id="shareCanvas" width="900" height="1350" aria-label="结果图片预览"></canvas>
            <img class="qr-image" id="qrImage" alt="" crossorigin="anonymous" />
            <div class="result-actions">
              <button class="primary" type="button" id="copyImageBtn">复制结果图片</button>
              <button class="ghost" type="button" id="downloadImageBtn">下载结果图片</button>
              <button class="ghost" type="button" id="copyTextBtn">复制结果文案</button>
              <button class="ghost" type="button" id="resultPrevBtn">返回上一题</button>
              <button class="ghost" type="button" id="restartBtn">重新测试</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      { tag: "第 1 题 / 人间路考", title: "路上看到有人东西掉了，你会？", options: [["追上去提醒，还帮忙捡起来", 8, 3, 2], ["喊一声：你东西掉了", 4, 1, 0], ["看一眼，觉得应该会有人提醒", -2, 0, 0], ["捡起来装兜里，回家再研究值不值钱", -13, -4, -2]] },
      { tag: "第 2 题 / 友情压力测试", title: "朋友深夜发来一大段崩溃小作文，你会？", options: [["认真看完，先安慰再帮他理问题", 8, 3, 1], ["先回一句抱抱，约明天细聊", 4, 2, 0], ["已读但脑子宕机，第二天再补救", -2, 0, 0], ["截图发小群：家人们新的连续剧来了", -13, -4, -3]] },
      { tag: "第 3 题 / 队伍里的你", title: "排队时有人插队，你会？", options: [["礼貌提醒他去后面排队", 6, 1, 4], ["不想吵架，默默忍了", 1, 0, 0], ["大声阴阳怪气：有人赶着投胎", 0, -1, -3], ["插到他前面还回头说：互相学习", -9, -3, -4]] },
      { tag: "第 4 题 / 承诺管理", title: "你答应帮朋友一个忙，但临时不想做了，你会？", options: [["提前说明原因，并给替代方案", 7, 2, 3], ["实话说今天做不了", 3, 0, 1], ["拖到最后一刻再说忘了", -5, -1, 0], ["装死三天，等对方自己怀疑人生", -11, -3, -3]] },

    function clamp(num, min, max) {
      return Math.max(min, Math.min(max, num));
    }

    function scoreTheme(score) {
      if (score >= 70) return scoreThemes.heaven;
      if (score >= 35) return scoreThemes.human;
      return scoreThemes.hell;
    }

    function applyResultTheme(score) {
      const theme = scoreTheme(score);
      el.result.classList.remove("theme-heaven", "theme-human", "theme-hell");
      el.result.classList.add(`theme-${theme.key}`);
      return theme;
    }

    function levelIndex(score) {
      return levelThresholds.findIndex(threshold => score >= threshold);
    }

    function getAlignment() {
      const moral = state.good > 4 ? "善良" : state.good < -4 ? "邪恶" : "中立";
      const action = state.order > 4 ? "守序" : state.order < -4 ? "混乱" : "";
      if (moral === "中立" && action === "") return "绝对中立";
      if (moral === "中立") return action + "中立";
      if (action === "") return "中立" + moral;
      return action + moral;
    }

    function updateMark() {
      const x = clamp(50 + state.good * 2.8, 10, 90);
      const y = clamp(50 - state.order * 2.8, 10, 90);
      const score = clamp(state.merit, 0, 100);
      const hue = score >= 65 ? "#79b45d" : score >= 35 ? "#efb333" : "#ef5555";
      el.soulMark.style.left = `calc(${x}% - 17px)`;
      el.soulMark.style.top = `calc(${y}% - 17px)`;
      el.soulMark.style.background = hue;
    }

    function start() {
      current = 0;
      answerSignature = 0;
      state = { merit: 50, good: 0, order: 0 };
      history = [];
      lastResult = null;
      el.questionArea.classList.remove("hide");
      el.questionNav.classList.remove("hide");
      el.result.classList.remove("show");
      el.result.classList.remove("theme-heaven", "theme-human", "theme-hell");
      el.shareCanvas.classList.remove("show");
      renderQuestion();
      updateMark();
      document.getElementById("quizPanel").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function renderQuestion() {
      const question = questions[current];
      el.tag.textContent = question.tag;
      el.title.textContent = question.title;
      el.questionNav.classList.remove("hide");
      el.options.innerHTML = "";
      question.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.type = "button";
        button.innerHTML = `<span class="letter">${String.fromCharCode(65 + index)}</span><span class="option-text">${option[0]}</span>`;
        button.addEventListener("click", () => choose(option, index));
        el.options.appendChild(button);
      });
      el.progress.style.width = `${(current / questions.length) * 100}%`;
      el.counter.textContent = `${current + 1} / ${questions.length}`;
      el.prevBtn.disabled = history.length === 0;
      el.prevBtn.setAttribute("aria-disabled", String(history.length === 0));
    }

    function choose(option, index) {
      history.push({
        current,
        state: { ...state },
        answerSignature
      });
      state.merit += option[1];
      state.good += option[2];
      state.order += option[3];
      answerSignature += (index + 1) * (current + 3);
      current += 1;
      updateMark();
      if (current >= questions.length) showResult();
      else renderQuestion();
    }

    function previousQuestion() {
      const previous = history.pop();
      if (!previous) return;
      current = previous.current;
      state = { ...previous.state };
      answerSignature = previous.answerSignature;
      lastResult = null;
      el.result.classList.remove("show");
      el.shareCanvas.classList.remove("show");
      el.questionArea.classList.remove("hide");
      renderQuestion();
      updateMark();
    }

    function pickRebirth(alignment, score) {
      const tier = levelIndex(score);
      const choices = rebirthPool[alignment][tier];
      return choices[Math.abs(answerSignature + state.good * 7 + state.order * 11) % choices.length];

      const cells = 29;

        ctx.fillRect(x + (cx + 1) * cell, y + (cy + 1) * cell, cell * 5, cell * 5);
        ctx.fillStyle = "#1d1d22";
        ctx.fillRect(x + (cx + 2) * cell, y + (cy + 2) * cell, cell * 3, cell * 3);
      }
      finder(1, 1);
      finder(21, 1);
      finder(1, 21);

          if (!inFinder && ((row * 17 + col * 31 + seed) % 7 < 3)) {

    function grain(ctx, x, y, width, height, alpha = .12, step = 7) {

          if ((n - Math.floor(n)) > .54) {
            ctx.fillStyle = (n - Math.floor(n * 1.7)) > .45 ? "#1d1d22" : "#ffffff";

    function crayonDust(ctx, x, y, width, height, colors = ["#ff4d58", "#5277ff", "#54c35d", "#ffc735"], alpha = .16, step = 18) {
      ctx.save();
      ctx.globalAlpha = alpha;
      for (let yy = y; yy < y + height; yy += step) {
        for (let xx = x; xx < x + width; xx += step) {
          const n = Math.sin(xx * 5.73 + yy * 9.31) * 10000;
          const f = n - Math.floor(n);
          if (f > .42) {
            ctx.fillStyle = colors[Math.floor(f * colors.length) % colors.length];
            ctx.beginPath();
            ctx.ellipse(xx + f * 9, yy + (1 - f) * 8, 1.8 + f * 2.8, 1.2 + f * 2.2, f * Math.PI, 0, Math.PI * 2);
            ctx.fill();

      ctx.restore();
    }

    function crayonLine(ctx, points, color, width = 8, passes = 3) {
      for (let p = 0; p < passes; p += 1) {
        ctx.save();
        ctx.globalAlpha = .58 - p * .12;
        ctx.strokeStyle = color;
        ctx.lineWidth = width - p;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(points[0][0] + Math.sin(p + 1) * 3, points[0][1] + Math.cos(p + 2) * 3);
        for (let i = 1; i < points.length; i += 1) {
          const [x, y] = points[i];
          const [px, py] = points[i - 1];
          const mx = (px + x) / 2 + Math.sin((i + p) * 3.2) * 9;
          const my = (py + y) / 2 + Math.cos((i + p) * 2.7) * 8;
          ctx.quadraticCurveTo(mx, my, x + Math.cos(i + p) * 3, y + Math.sin(i + p) * 3);
        }
        ctx.stroke();
        ctx.restore();
      }
    }

    function renderResultIllustration() {
      if (!lastResult) return;
      const canvas = el.resultIllustration;
      const ctx = canvas.getContext("2d");
      canvas.width = 224;
      canvas.height = 224;
      drawItemIllustration(ctx, lastResult.item, { type: lastResult.type }, 0, 0, 224);
    }

    function showResult() {
      const score = clamp(state.merit, 0, 100);
      const alignment = getAlignment();
      const tier = levelIndex(score);
      const item = pickRebirth(alignment, score);
      const level = levelNames[tier];
      const chaos = Math.max(0, -state.order);
      const profile = getIdentityProfile(item);
      const verdict = makeVerdict(item, alignment, score, level);
      const theme = applyResultTheme(score);

      lastResult = { score, alignment, item, level, chaos, icon: profile.icon, type: profile.type, text: verdict, theme };
      el.questionArea.classList.add("hide");
      el.result.classList.add("show");
      el.resultPrevBtn.disabled = history.length === 0;
      el.resultPrevBtn.setAttribute("aria-disabled", String(history.length === 0));
      el.progress.style.width = "100%";
      el.counter.textContent = `${questions.length} / ${questions.length}`;
      el.score.textContent = score;
      el.scoreLevel.textContent = `${theme.name} · ${level}`;
      el.rebirthName.textContent = item;
      el.alignmentBadge.textContent = alignment;
      el.fateBadge.textContent = theme.name;
      el.axisBadge.textContent = `善恶轴 ${state.good >= 0 ? "+" : ""}${state.good}`;
      el.goodMetric.textContent = state.good >= 0 ? `+${state.good}` : state.good;
      el.orderMetric.textContent = state.order >= 0 ? `+${state.order}` : state.order;
      el.chaosMetric.textContent = chaos;
      el.resultCopy.textContent = lastResult.text;
      renderResultIllustration();
      renderShareCard();
      updateMark();
    }

    function randomResult() {
      const alignments = Object.keys(rebirthPool);
      const alignment = alignments[Math.floor(Math.random() * alignments.length)];
      const randomTier = Math.floor(Math.random() * levelNames.length);
      history = [];
      answerSignature = Math.floor(Math.random() * 1000);
      state.merit = clamp(Math.round(90 - randomTier * 17 + Math.random() * 8), 0, 100);
      state.good = alignment.includes("善良") ? 8 : alignment.includes("邪恶") ? -8 : 0;
      state.order = alignment.includes("守序") ? 8 : alignment.includes("混乱") ? -8 : 0;
      el.questionArea.classList.add("hide");
      el.result.classList.add("show");
      el.progress.style.width = "100%";
      el.counter.textContent = `随机 / ${questions.length}`;
      showResult();
      document.getElementById("quizPanel").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 6) {
      const chars = Array.from(text);
      let line = "";
      let lines = 0;
      for (let i = 0; i < chars.length; i += 1) {
        const testLine = line + chars[i];
        if (ctx.measureText(testLine).width > maxWidth && line) {
          ctx.fillText(line, x, y);
          line = chars[i];
          y += lineHeight;
          lines += 1;
          if (lines >= maxLines - 1) break;
        } else {
          line = testLine;
        }
      }
      if (line && lines < maxLines) ctx.fillText(line, x, y);
    }

    function drawTextBlock(ctx, text, x, y, maxWidth, lineHeight, maxLines = 6) {
      const chars = Array.from(text);
      const rows = [];
      let line = "";
      for (let i = 0; i < chars.length; i += 1) {
        const testLine = line + chars[i];
        if (ctx.measureText(testLine).width > maxWidth && line) {
          rows.push(line);
          line = chars[i];
          if (rows.length >= maxLines - 1) break;
        } else {
          line = testLine;
        }
      }
      if (line && rows.length < maxLines) rows.push(line);
      rows.forEach((row, index) => ctx.fillText(row, x, y + index * lineHeight));
      return y + rows.length * lineHeight;
    }

    function fontSizeForText(ctx, text, maxWidth, startSize, minSize) {
      let size = startSize;
      while (size > minSize) {
        ctx.font = `900 ${size}px Arial Black, Microsoft YaHei, sans-serif`;
        if (ctx.measureText(text).width <= maxWidth || text.length > 5) break;
        size -= 2;
      }
      return size;
    }

    function roundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    function poly(ctx, points, fill, stroke = null, width = 2) {
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i += 1) ctx.lineTo(points[i][0], points[i][1]);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = width;
        ctx.stroke();
      }
    }

    function facetCluster(ctx, x, y, scale, colors, seed = 1) {
      const cells = [
        [[0, 0], [34, -16], [62, 2], [28, 22]],
        [[28, 22], [62, 2], [94, 22], [56, 46]],
        [[-18, 30], [28, 22], [56, 46], [18, 72]],
        [[56, 46], [94, 22], [112, 66], [72, 88]],
        [[18, 72], [56, 46], [72, 88], [34, 112]],
        [[34, 112], [72, 88], [106, 112], [62, 140]],
        [[-28, 70], [18, 72], [34, 112], [-8, 118]]
      ];
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      cells.forEach((cell, i) => {
        const c = colors[(i + seed) % colors.length];
        poly(ctx, cell, c, "rgba(17,17,17,.28)", 1.2);
      });
      ctx.restore();
    }

        const gold = theme.decor || "#f2b321";
        const feathersLeft = [
          [[x + 136 * scale, y + 96 * scale], [x + 86 * scale, y + 60 * scale], [x + 24 * scale, y + 96 * scale], [x + 102 * scale, y + 126 * scale]],
          [[x + 132 * scale, y + 122 * scale], [x + 72 * scale, y + 100 * scale], [x + 34 * scale, y + 156 * scale], [x + 108 * scale, y + 150 * scale]],
          [[x + 128 * scale, y + 148 * scale], [x + 78 * scale, y + 154 * scale], [x + 56 * scale, y + 212 * scale], [x + 118 * scale, y + 182 * scale]]
        ];
        const feathersRight = [
          [[x + 154 * scale, y + 96 * scale], [x + 204 * scale, y + 60 * scale], [x + 266 * scale, y + 96 * scale], [x + 188 * scale, y + 126 * scale]],
          [[x + 158 * scale, y + 122 * scale], [x + 218 * scale, y + 100 * scale], [x + 256 * scale, y + 156 * scale], [x + 182 * scale, y + 150 * scale]],
          [[x + 162 * scale, y + 148 * scale], [x + 212 * scale, y + 154 * scale], [x + 234 * scale, y + 212 * scale], [x + 172 * scale, y + 182 * scale]]
        ];
        ["#dff3ff", "#ffffff", "#a9d6ff"].forEach((color, i) => {
          poly(ctx, feathersLeft[i], color, wingStroke, 3.4 * scale);
          poly(ctx, feathersRight[i], color, wingStroke, 3.4 * scale);
        });
        poly(ctx, [[x + 126 * scale, y + 94 * scale], [x + 145 * scale, y + 152 * scale], [x + 164 * scale, y + 94 * scale], [x + 145 * scale, y + 74 * scale]], "#f8fbff", wingStroke, 3.5 * scale);
        ctx.strokeStyle = gold;
        ctx.lineWidth = 12 * scale;
        ctx.beginPath();
        ctx.ellipse(x + 146 * scale, y + 30 * scale, 72 * scale, 20 * scale, -.12, 0, Math.PI * 2);
        ctx.stroke();
        poly(ctx, [[x + 230 * scale, y + 54 * scale], [x + 245 * scale, y + 78 * scale], [x + 272 * scale, y + 84 * scale], [x + 250 * scale, y + 100 * scale], [x + 248 * scale, y + 128 * scale], [x + 230 * scale, y + 106 * scale], [x + 202 * scale, y + 112 * scale], [x + 218 * scale, y + 88 * scale]], "#ffe17a", wingStroke, 2.5 * scale);
      } else if (theme.key === "human") {
        const green = theme.decor || "#79b45d";
        ctx.fillStyle = "#dff5d7";
        ctx.beginPath();
        ctx.moveTo(x + 4 * scale, y + 228 * scale);
        ctx.quadraticCurveTo(x + 74 * scale, y + 188 * scale, x + 146 * scale, y + 216 * scale);
        ctx.quadraticCurveTo(x + 214 * scale, y + 244 * scale, x + 292 * scale, y + 202 * scale);
        ctx.lineTo(x + 292 * scale, y + 258 * scale);
        ctx.lineTo(x + 4 * scale, y + 258 * scale);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = theme.border || "#0b3f23";
        ctx.lineWidth = 4 * scale;
        ctx.stroke();
        ctx.strokeStyle = "#8b5a2b";
        ctx.lineWidth = 14 * scale;
        ctx.beginPath();
        ctx.moveTo(x + 108 * scale, y + 224 * scale);
        ctx.lineTo(x + 118 * scale, y + 116 * scale);
        ctx.moveTo(x + 158 * scale, y + 220 * scale);
        ctx.lineTo(x + 166 * scale, y + 124 * scale);
        ctx.stroke();
        facetCluster(ctx, x + 44 * scale, y + 42 * scale, scale * .8, ["#0b5c2e", "#2f9b4d", green, "#e9ffe0"], 3);
        facetCluster(ctx, x + 120 * scale, y + 42 * scale, scale * .72, ["#0b5c2e", "#2f9b4d", green, "#e9ffe0"], 2);
        ctx.strokeStyle = "#2f9b4d";
        ctx.lineWidth = 5 * scale;
        for (let i = 0; i < 7; i += 1) {
          const bx = x + (20 + i * 38) * scale;
          ctx.beginPath();
          ctx.moveTo(bx, y + 244 * scale);
          ctx.lineTo(bx + 12 * scale, y + (220 + (i % 3) * 6) * scale);
          ctx.stroke();
        }
      } else {
        const black = theme.border || "#09090b";
        const red = theme.decor || "#d51f2a";
        poly(ctx, [[x + 40 * scale, y + 210 * scale], [x + 92 * scale, y + 52 * scale], [x + 128 * scale, y + 194 * scale]], red, black, 5 * scale);
        poly(ctx, [[x + 170 * scale, y + 194 * scale], [x + 212 * scale, y + 52 * scale], [x + 262 * scale, y + 210 * scale]], red, black, 5 * scale);
        poly(ctx, [[x + 74 * scale, y + 184 * scale], [x + 94 * scale, y + 94 * scale], [x + 116 * scale, y + 176 * scale]], "#ff6a3d", black, 2.8 * scale);
        poly(ctx, [[x + 186 * scale, y + 176 * scale], [x + 208 * scale, y + 94 * scale], [x + 228 * scale, y + 184 * scale]], "#ff6a3d", black, 2.8 * scale);
        ctx.strokeStyle = black;
        ctx.lineWidth = 6 * scale;
        ctx.beginPath();
        ctx.moveTo(x + 10 * scale, y + 248 * scale);
        for (let i = 0; i < 7; i += 1) {
          ctx.lineTo(x + (42 + i * 38) * scale, y + (i % 2 ? 248 : 206) * scale);
        }
        ctx.stroke();
        ctx.fillStyle = red;
        ctx.globalAlpha = .22;
        ctx.beginPath();
        ctx.ellipse(x + 148 * scale, y + 242 * scale, 126 * scale, 26 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawAxis(ctx, x, y, size) {
      ctx.save();
      ctx.fillStyle = "#fffdf8";
      ctx.strokeStyle = "#1d1d22";
      ctx.lineWidth = Math.max(3, size * .018);
      roundedRect(ctx, x, y, size, size, size * .08);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = "#b9b5c4";
      ctx.lineWidth = Math.max(2, size * .012);
      ctx.beginPath();
      ctx.moveTo(x + size / 2, y + 28);
      ctx.lineTo(x + size / 2, y + size - 28);
      ctx.moveTo(x + 28, y + size / 2);
      ctx.lineTo(x + size - 28, y + size / 2);
      ctx.stroke();

      ctx.globalAlpha = .22;
      ctx.fillStyle = "#ef5555";
      ctx.beginPath();
      ctx.arc(x + size * .38, y + size * .52, size * .24, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#4f74ff";
      ctx.beginPath();
      ctx.arc(x + size * .62, y + size * .52, size * .24, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      const pointX = x + clamp(50 + state.good * 2.8, 10, 90) / 100 * size;
      const pointY = y + clamp(50 - state.order * 2.8, 10, 90) / 100 * size;
      ctx.fillStyle = lastResult.score >= 65 ? "#79b45d" : lastResult.score >= 35 ? "#efb333" : "#ef5555";
      ctx.strokeStyle = "#1d1d22";
      ctx.lineWidth = Math.max(4, size * .02);
      ctx.beginPath();
      ctx.arc(pointX, pointY, Math.max(18, size * .09), 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#fffdf8";
      ctx.strokeStyle = "#dfdce8";
      ctx.lineWidth = Math.max(2, size * .01);
      [
        [x + 18, y + size / 2 - 36, 46, 28, "恶"],
        [x + size - 64, y + size / 2 - 36, 46, 28, "善"],
        [x + size / 2 - 34, y + 18, 68, 28, "混乱"],
        [x + size / 2 - 34, y + size - 46, 68, 28, "守序"]
      ].forEach(([rx, ry, rw, rh, text]) => {
        roundedRect(ctx, rx, ry, rw, rh, 14);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#6d6d75";
        ctx.font = "700 20px Arial, Microsoft YaHei, sans-serif";
        ctx.fillText(text, rx + (rw - ctx.measureText(text).width) / 2, ry + 20);
        ctx.fillStyle = "#fffdf8";
      });
      ctx.restore();
    }

    function doodlePath(ctx, points, color = "#1d1d22", width = 5, closed = false) {
      if (!points.length) return;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i += 1) {
        const [x, y] = points[i];
        const [px, py] = points[i - 1];
        const mx = (px + x) / 2 + Math.sin(i * 4.7) * 8;
        const my = (py + y) / 2 + Math.cos(i * 3.9) * 7;
        ctx.quadraticCurveTo(mx, my, x, y);
      }
      if (closed) ctx.closePath();
      ctx.stroke();
      ctx.globalAlpha = .28;
      ctx.translate(4, -3);
      ctx.stroke();
      ctx.restore();
    }

    function posterBlob(ctx, points, fill, stroke = "#1d1d22", width = 5) {
      if (!points.length) return;
      ctx.save();
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i += 1) {
        const [x, y] = points[i];
        const [px, py] = points[i - 1];
        ctx.quadraticCurveTo((px + x) / 2 + Math.sin(i * 2.3) * 12, (py + y) / 2 + Math.cos(i * 2.9) * 10, x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.globalAlpha = .18;
      ctx.translate(6, -4);
      ctx.stroke();
      ctx.restore();
    }

    function rectSketch(ctx, x, y, width, height, fill, radius = 12, lineWidth = 4, stroke = "#1d1d22") {
      ctx.save();
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = lineWidth;
      roundedRect(ctx, x, y, width, height, radius);
      ctx.fill();
      ctx.stroke();
      ctx.globalAlpha = .24;
      roundedRect(ctx, x + 5, y - 3, width - 2, height + 4, radius + 3);
      ctx.stroke();
      ctx.restore();
    }

    function stampText(ctx, text, x, y, fill, rotate = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotate);
      ctx.fillStyle = fill;
      ctx.strokeStyle = "#1d1d22";
      ctx.lineWidth = 3;
      roundedRect(ctx, 0, 0, 170, 48, 15);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#1d1d22";
      ctx.font = "900 22px Arial Black, Microsoft YaHei, sans-serif";
      ctx.fillText(text, 22, 31);
      ctx.restore();
    }

    function drawShareScene(ctx, theme) {
      const frame = theme.frame || "#050505";
      const paper = theme.paper || "#fff";
      const border = theme.border || "#111";
      const display = theme.display || "#111";
      const decor = theme.decor || theme.accent || "#efb333";
      ctx.fillStyle = frame;
      ctx.fillRect(0, 0, 900, 1350);
      ctx.fillStyle = paper;
      ctx.fillRect(42, 42, 816, 1266);
      ctx.save();
      ctx.globalAlpha = theme.key === "hell" ? .18 : .14;
      ctx.fillStyle = decor;
      ctx.fillRect(42, 42, 816, 244);
      ctx.globalAlpha = theme.key === "heaven" ? .16 : .10;
      ctx.fillStyle = frame;
      ctx.fillRect(42, 1170, 816, 138);
      ctx.restore();
      ctx.strokeStyle = border;
      ctx.lineWidth = 6;
      ctx.strokeRect(42, 42, 816, 1266);
      grain(ctx, 42, 42, 816, 1266, .045, 9);
      ctx.fillStyle = display;
      ctx.font = "700 13px Arial, Microsoft YaHei, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("Vegetable Rebirth Diary No.2026", 832, 70);
      ctx.fillText("Moral Coordinate Poster", 832, 88);
      ctx.textAlign = "left";
      ctx.fillText("Copyright 2026 Merit Test. All Rights Reserved.", 62, 1290);
      ctx.save();
      drawPosterPlant(ctx, theme, 568, 82, .74);
      ctx.restore();
    }

    async function renderShareCard(useRemoteQr = true) {
      if (!lastResult) return;
      const canvas = el.shareCanvas;
      const ctx = canvas.getContext("2d");
      const theme = lastResult.theme || scoreTheme(lastResult.score);
      canvas.width = 900;
      canvas.height = 1350;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawShareScene(ctx, theme);
      const display = theme.display || "#1d1d22";
      const muted = theme.key === "hell" ? "#5d2424" : theme.key === "human" ? "#456a4b" : "#4f5d83";
      const panel = theme.panel || "#fff";
      const border = theme.border || "#1d1d22";
      const decor = theme.decor || theme.accent;

      ctx.fillStyle = display;
      ctx.font = "900 34px Arial Black, Microsoft YaHei, sans-serif";
      ctx.fillText(`${theme.title} · 功德分投胎报告`, 62, 112);
      ctx.font = "700 24px Arial, Microsoft YaHei, sans-serif";
      ctx.fillStyle = muted;
      ctx.fillText(theme.subtitle, 62, 150);

      ctx.fillStyle = display;
      ctx.font = "900 118px Arial Black, Microsoft YaHei, sans-serif";
      ctx.fillText(String(lastResult.score), 62, 252);
      ctx.font = "900 28px Arial Black, Microsoft YaHei, sans-serif";
      ctx.fillStyle = muted;
      ctx.fillText("功德分", 240, 238);
      ctx.fillStyle = decor;
      ctx.strokeStyle = border;
      ctx.lineWidth = 3;
      roundedRect(ctx, 360, 202, 150, 48, 24);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = theme.key === "hell" ? "#fffafa" : display;
      ctx.font = "900 22px Arial Black, Microsoft YaHei, sans-serif";
      ctx.fillText(theme.name, 386, 234);

      rectSketch(ctx, 62, 306, 776, 520, panel, 0, 4, border);
      grain(ctx, 54, 292, 792, 540, .055, 10);

      drawItemIllustration(ctx, lastResult.item, { type: lastResult.type }, 88, 348, 270);

      ctx.fillStyle = display;
      ctx.font = "900 32px Arial Black, Microsoft YaHei, sans-serif";
      ctx.fillText(lastResult.alignment, 430, 348);
      const titleSize = fontSizeForText(ctx, lastResult.item, 370, 58, 38);
      ctx.font = `900 ${titleSize}px Arial Black, Microsoft YaHei, sans-serif`;
      ctx.fillStyle = display;
      const titleEndY = drawTextBlock(ctx, lastResult.item, 430, 430, 370, titleSize + 10, 3);
      ctx.font = "800 26px Arial, Microsoft YaHei, sans-serif";
      ctx.fillStyle = muted;
      let infoY = Math.max(570, titleEndY + 26);
      ctx.fillText(lastResult.level, 430, infoY);
      ctx.fillText(lastResult.type, 430, infoY + 38);
      ctx.fillText(`善恶轴 ${state.good >= 0 ? "+" : ""}${state.good}`, 430, infoY + 76);
      ctx.fillText(`秩序轴 ${state.order >= 0 ? "+" : ""}${state.order}`, 430, infoY + 114);
      drawAxis(ctx, 594, 578, 220);

      rectSketch(ctx, 62, 868, 776, 240, panel, 0, 4, border);
      grain(ctx, 54, 882, 792, 230, .055, 11);
      ctx.fillStyle = display;
      ctx.font = "700 26px Arial, Microsoft YaHei, sans-serif";
      drawTextBlock(ctx, lastResult.text, 76, 930, 748, 42, 5);

      rectSketch(ctx, 650, 1122, 178, 176, panel, 0, 3, border);
      await drawShareQr(ctx, 678, 1138, 122);
      ctx.fillStyle = muted;
      ctx.font = "700 18px Arial, Microsoft YaHei, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("扫码测试", 739, 1286);
      ctx.textAlign = "left";

      ctx.fillStyle = muted;
      ctx.font = "700 22px Arial, Microsoft YaHei, sans-serif";
      ctx.fillText("复制图片，把这份灵魂判决发给朋友", 72, 1258);
      el.shareCanvas.classList.add("show");
    }

    function canvasToBlob(canvas) {
      return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
    }

    function resultFileName() {
      const safeName = (el.rebirthName.textContent || "投胎结果")
        .replace(/[\\/:*?"<>|]/g, "")
        .slice(0, 18);
      return `功德分投胎报告-${el.score.textContent}-${safeName}.png`;
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function isMobileBrowser() {
      return /Android|iPhone|iPad|iPod|Mobile|MicroMessenger/i.test(navigator.userAgent);
    }

    async function openImageSavePage(blob, fileName, pendingWindow = null) {
      const dataUrl = await blobToDataUrl(blob);
      const target = pendingWindow || window.open("", "_blank");
      if (!target) {
        window.location.href = dataUrl;
        return;
      }
      target.document.open();
      target.document.write(`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${fileName}</title><style>body{margin:0;padding:18px;background:#111;color:#fff;font-family:Arial,'Microsoft YaHei',sans-serif;text-align:center}p{margin:0 0 14px;font-weight:800;line-height:1.6}img{display:block;width:100%;max-width:520px;margin:0 auto;background:#fff}</style></head><body><p>长按图片保存到相册，或用浏览器菜单保存图片</p><img src="${dataUrl}" alt="功德分投胎报告"></body></html>`);
      target.document.close();
    }

    async function copyImageResult() {
      await renderShareCard();
      const blob = await canvasToBlob(el.shareCanvas);
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          el.copyImageBtn.textContent = "图片已复制";
        } else {
          throw new Error("clipboard image unsupported");
        }
      } catch {
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank");
        el.copyImageBtn.textContent = "已打开图片";
      }
      setTimeout(() => el.copyImageBtn.textContent = "复制结果图片", 1500);
    }

    async function downloadImageResult() {
      const pendingWindow = isMobileBrowser() ? window.open("", "_blank") : null;
      await renderShareCard();
      const blob = await canvasToBlob(el.shareCanvas);
      const fileName = resultFileName();
      if (isMobileBrowser()) {
        try {
          const file = new File([blob], fileName, { type: "image/png" });
          if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
            if (pendingWindow) pendingWindow.close();
            await navigator.share({
              files: [file],
              title: "功德分投胎报告",
              text: "保存或分享我的功德分投胎报告"
            });
            el.downloadImageBtn.textContent = "已打开保存面板";
            setTimeout(() => el.downloadImageBtn.textContent = "下载结果图片", 1800);
            return;
          }
        } catch {
          // Fall through to the image save page for browsers without file sharing.
        }
        await openImageSavePage(blob, fileName, pendingWindow);
        el.downloadImageBtn.textContent = "长按图片保存";
        setTimeout(() => el.downloadImageBtn.textContent = "下载结果图片", 2200);
        return;
      }
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1200);
      el.downloadImageBtn.textContent = "已开始下载";
      setTimeout(() => el.downloadImageBtn.textContent = "下载结果图片", 1500);
    }

    async function copyTextResult() {
      const text = `我的功德分：${el.score.textContent}\n我的阵营：${el.alignmentBadge.textContent}\n下辈子投胎成：${el.rebirthName.textContent}\n${el.resultCopy.textContent}`;
      try {
        await navigator.clipboard.writeText(text);
        el.copyTextBtn.textContent = "文案已复制";
      } catch {
        el.copyTextBtn.textContent = "复制失败";
      }
      setTimeout(() => el.copyTextBtn.textContent = "复制结果文案", 1200);
    }

    el.startBtn.addEventListener("click", start);
    el.readyBtn.addEventListener("click", start);
    el.restartBtn.addEventListener("click", start);
    el.prevBtn.addEventListener("click", previousQuestion);
    el.resultPrevBtn.addEventListener("click", previousQuestion);
    el.randomBtn.addEventListener("click", randomResult);
    el.copyImageBtn.addEventListener("click", copyImageResult);
    el.downloadImageBtn.addEventListener("click", downloadImageResult);
    el.copyTextBtn.addEventListener("click", copyTextResult);
    el.questionCountText.textContent = questions.length;
    el.counter.textContent = `0 / ${questions.length}`;
    updateMark();
  </script>
</body>
